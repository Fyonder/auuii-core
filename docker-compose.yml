# ==========================================================
#  AUUII CORE — n8n + Evolution API na mesma rede Docker
#
#  Só o que importa:
#    n8n       -> http://localhost:5678
#    evolution -> http://localhost:8080
#
#  Entre eles, pela rede interna auuii-net:
#    n8n chama a Evolution em ......... http://evolution:8080
#    Evolution chama o n8n em ......... http://n8n:5678
#
#  (o postgres abaixo existe só porque a Evolution v2 não
#   inicia sem ele — você não precisa mexer nele)
#
#  A API de negócio NÃO mora aqui: é o seu backend hospedado,
#  em AUUII_API_URL. O n8n chama /api/suporte/* nele.
# ==========================================================
name: auuii

services:
  # ----------------------------------------------------
  # n8n — o cérebro do agente. Usa SQLite, sem banco externo.
  # ----------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-latest}
    container_name: auuii-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Sem HTTPS, o n8n se recusa a emitir o cookie de sessao fora de
      # localhost — e o painel nao deixa entrar pelo IP da rede. Em rede
      # local sem dominio, desligue (N8N_SECURE_COOKIE=false no .env).
      # No modo prod, com Caddy e HTTPS, deixe true.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # info (padrao) fala no boot e quando um fluxo roda. Para investigar
      # um fluxo que nao dispara, suba para debug — fica muito verboso,
      # entao volte para info depois. Niveis: error warn info verbose debug
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-336}
      # permite ler variaveis com {{ $env.NOME }} dentro dos nos
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # atalhos prontos para usar dentro dos fluxos:
      #   {{ $env.EVOLUTION_API_URL }}  e  {{ $env.EVOLUTION_API_KEY }}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      # O numero da Goby esta na API oficial (Meta) desde 08/10/2026: a Nina responde pela
      # ponte, que fala com a Graph API (docs/ATENDIMENTO.md). Vazio = volta pra Evolution.
      NINA_WHATSAPP_URL: ${NINA_WHATSAPP_URL-http://ponte:3100}
      # Aviso interno da Nina pro suporte sai por este numero da Evolution (pela Meta, fora
      # da janela de 24 h, so template)
      NINA_AVISO_INSTANCIA: ${NINA_AVISO_INSTANCIA:-auuii}
      # sua API (motoboys, fila, corridas) — usada pelas tools do agente
      #   {{ $env.AUUII_API_URL }}  e  {{ $env.AUUII_API_TOKEN }}
      AUUII_API_URL: ${AUUII_API_URL:-}
      AUUII_API_TOKEN: ${AUUII_API_TOKEN:-}
      # Chave fixa da Nina (Goby) — mesmo valor de SUPORTE_API_KEY_GOBY no Render.
      AUUII_API_TOKEN_GOBY: ${AUUII_API_TOKEN_GOBY:-}
      # Robo da Goby (sistema do socio): rota quem, perfil, fila, reservas, vagas, desempenho, ranking
      ROBO_GOBY_URL: ${ROBO_GOBY_URL:-https://emcynyuzuafovconujwo.supabase.co/functions/v1/robo-goby}
      ROBO_GOBY_KEY: ${ROBO_GOBY_KEY:-}
      # Nina: segundos que cada mensagem espera pra juntar as seguidas (fluxo: "Espera mais mensagens")
      NINA_ESPERA_JUNTAR: ${NINA_ESPERA_JUNTAR:-8}
      # Segredo da entrada de teste da Nina (/webhook/goby-teste, header x-nina-segredo). Mesmo
      # valor na ponte. Vazio = a entrada recusa tudo (o chat da Nina nos sites para).
      NINA_TESTE_SEGREDO: ${NINA_TESTE_SEGREDO:-}
      # Avisos do robô (fila com proteção do WhatsApp, 08/10): por rodada de 1 min, por hora, e a
      # janela em que um 2º código pro mesmo número não sai
      AVISOS_POR_MINUTO: ${AVISOS_POR_MINUTO:-2}
      AVISOS_POR_HORA: ${AVISOS_POR_HORA:-30}
      AVISOS_JANELA_CODIGO_MIN: ${AVISOS_JANELA_CODIGO_MIN:-5}
      AVISOS_EQUIPE_JANELA_MIN: ${AVISOS_EQUIPE_JANELA_MIN:-15}
      # Por qual instancia da Evolution os avisos saem (08/10: o numero da Auuii, agora da Nina)
      AVISOS_INSTANCIA: ${AVISOS_INSTANCIA:-auuii}
      # instancia do WhatsApp e numero do suporte humano (handoff)
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-auuii}
      SUPORTE_WHATSAPP: ${SUPORTE_WHATSAPP:-}
    ports:
      # BIND_ADDR limita quem alcanca a porta. Vazio/0.0.0.0 = qualquer um
      # na Wi-Fi. Com o IP do Tailscale, so os aparelhos da rede privada —
      # de dentro ou de fora de casa. O agente nao depende disto: n8n e
      # Evolution conversam pela rede interna do Docker, nao por estas portas.
      - "${BIND_ADDR:-0.0.0.0}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - auuii-net

  # ----------------------------------------------------
  # Evolution API — a ponte com o WhatsApp
  # ----------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_TAG:-latest}
    container_name: auuii-evolution
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      N8N_ENABLED: "true"
      # Webhook GLOBAL -> ponte (aba Atendimento do painel). E independente do
      # webhook da instancia, que vai pro n8n: a Evolution dispara os dois (sao
      # dois `if` separados no webhook.controller). Desligado por padrao — liga
      # junto com a ponte (PONTE_ATIVA=true e COMPOSE_PROFILES=ponte no .env).
      # Ligar sem a ponte de pe faz a Evolution tentar e re-tentar cada evento.
      WEBHOOK_GLOBAL_ENABLED: ${PONTE_ATIVA:-false}
      WEBHOOK_GLOBAL_URL: http://ponte:3100/evolution/${PONTE_WEBHOOK_SECRET:-desligado}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # So o que vira conversa. Estes flags valem so pro global; o da instancia
      # tem a lista propria (MESSAGES_UPSERT) e nao muda.
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      # Reinício do n8n não pode perder mensagem (dono, 07/10/2026: "isso não pode acontecer").
      # Enquanto o n8n sobe, ele recusa a conexão e depois responde 404 até ativar os
      # fluxos (~30-60 s); com o padrão, 404 está na lista de "não tenta de novo" e a
      # Evolution desistia na hora (a pergunta das 16:16:50 se perdeu assim). Agora: 404
      # tenta de novo, até 12 vezes, de 5 s até 30 s entre elas (~2-3 min no total).
      WEBHOOK_RETRY_MAX_ATTEMPTS: ${WEBHOOK_RETRY_MAX_ATTEMPTS:-12}
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: ${WEBHOOK_RETRY_INITIAL_DELAY_SECONDS:-5}
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: ${WEBHOOK_RETRY_MAX_DELAY_SECONDS:-30}
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES: ${WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES:-400,401,403,422}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - auuii-net

  # ----------------------------------------------------
  # Peça interna da Evolution. Sem porta exposta.
  # A v2 roda migrations no boot e não inicia sem isso.
  # ----------------------------------------------------
  evolution-db:
    image: postgres:16-alpine
    container_name: auuii-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - auuii-net

  # ----------------------------------------------------
  # Ponte — leva as conversas pro painel (aba Atendimento)
  # e traz as mensagens que o operador manda de la.
  # Sem porta publicada: so a Evolution fala com ela, pela
  # rede interna. Ela e quem liga pra fora (Auuii-Backend),
  # entao o PC continua sem porta aberta pra internet.
  # Se ela cair, a IA segue atendendo; o painel so atrasa
  # (a fila fica em disco e entrega quando voltar).
  # Liga com COMPOSE_PROFILES=ponte no .env.
  # ----------------------------------------------------
  ponte:
    build: ./ponte
    image: auuii-ponte:local
    container_name: auuii-ponte
    profiles: ["ponte"]
    restart: unless-stopped
    depends_on:
      - evolution
    environment:
      BACKEND_URL: ${AUUII_API_URL:-https://ifood.onrender.com}
      PONTE_API_KEY: ${PONTE_API_KEY:-}
      PONTE_WEBHOOK_SECRET: ${PONTE_WEBHOOK_SECRET:-}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-auuii}
      SUPORTE_WHATSAPP: ${SUPORTE_WHATSAPP:-}
      # Numero da API oficial (Meta) = o da Goby. Vazios = parte da Meta desligada.
      META_INSTANCIA: ${META_INSTANCIA:-goby}
      # Instancia da Evolution que tambem e da Nina (08/10: Duda desligada, numero da Auuii
      # passou pra Nina). No painel vira a mesma conversa do numero da Meta. Vazio = nenhuma.
      EVOLUTION_DA_META: ${EVOLUTION_DA_META-auuii}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      # Chat da Nina nos sites: vai no header x-nina-segredo pro /webhook/goby-teste
      NINA_TESTE_SEGREDO: ${NINA_TESTE_SEGREDO:-}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ponte_dados:/data
    mem_limit: 128m
    networks:
      - auuii-net

volumes:
  n8n_data:
  evolution_instances:
  evolution_db:
  ponte_dados:

networks:
  auuii-net:
    name: auuii-net
    driver: bridge
